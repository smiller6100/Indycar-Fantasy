<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>IndyCar Fantasy 2026</title>
  <meta name="description" content="IndyCar Fantasy League 2026"/>
  <meta name="theme-color" content="#ff5500"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #08080e; }
    #root { min-height: 100vh; }
    #loading {
      position: fixed; inset: 0;
      background: #08080e;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #9090aa; font-family: sans-serif;
      gap: 16px;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid #ff5500;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Loading IndyCar Fantasy...</div>
  </div>
  <div id="root"></div>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
      }
    }
  </script>

  <script type="module">
    import { createRoot } from 'react-dom/client';
    import { createElement } from 'react';

    // Dynamically import the app
    import('./app.jsx')
      .then(module => {
        document.getElementById('loading').style.display = 'none';
        const App = module.default;
        createRoot(document.getElementById('root')).render(createElement(App));
      })
      .catch(err => {
        document.getElementById('loading').innerHTML =
          '<div style="color:#ff4444;text-align:center;padding:40px"><h2>Error loading app</h2><p style="margin-top:8px;font-size:14px">' + err.message + '</p></div>';
      });
  </script>
</body>
</html>
